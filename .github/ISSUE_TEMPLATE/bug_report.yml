name: Bug report / 问题反馈
description: Report a reproducible application or MCP problem using synthetic data.
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: GlassTodo version
      placeholder: "0.1.12"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Windows version, DPI, theme, docking edge, animation setting, and agent client if relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Use fake todo text. Remove credentials and personal content from screenshots and logs.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期与实际结果
    validations:
      required: true
