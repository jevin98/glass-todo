name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and native regressions
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: HTTP MCP 2025 flow
        run: python scripts/smoke_mcp.py
      - name: HTTP MCP 2026 flow
        env:
          MCP_TEST_PROTOCOL: '2026-07-28'
        run: python scripts/smoke_mcp.py
      - name: Direct data client
        run: python scripts/test_mcp_data_client.py
      - name: Dependency notices
        run: python scripts/collect_licenses.py
      - name: Portable package
        shell: pwsh
        run: ./scripts/build.ps1 -SkipTests -UseCurrentToolchain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GlassTodo-windows-x64
          path: |
            dist/GlassTodo-*-windows-x64.zip
            dist/GlassTodo-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
